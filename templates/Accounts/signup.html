{% extends 'home/base.html' %}
{% load static %}
{% block start %}


<style>
  #first{
    background-color: lightblue;
  }
</style>


<div class="container card col-3 shadow mt-2" id="first">
  <h4 class="mt-3">Sign Up</h4>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3 mt-2">
      <label for="exampleInputEmail1" class="form-label">First Name</label>
      <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="first_name">
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Last Name</label>
      <input name="last_name" type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">email</label>
      <input name="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input name="password" type="password" class="form-control" id="exampleInputPassword1">
    </div>
    <button type="submit" class="btn btn-primary mb-4">Submit</button>
  </form>
</div>
{% endblock %}
