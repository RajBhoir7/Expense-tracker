{% include 'home\base.html' %}
{% block start %}

<style>
  #first{
    background-color: lightblue;
  }
</style>
<div class="container card col-3 mt-5 shadow" id="first">
  {% if data %}
  <h3>Update Expense</h3>
  {% else %}
  <h3 class="mt-2">Add Expense</h3>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3 mt-4">
      <label for="exampleInputEmail1" class="form-label">Expence Name</label>
      <input type="text" class="form-control" id="" name="Expense Name" aria-describedby="emailHelp"
        value="{{data.name}}">
    </div>


    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Amount</label>
      <input type="number" class="form-control" id="#" name="Amount" aria-describedby="emailHelp"
        value="{{data.amount}}">
    </div>
    <div class="mb-3">
      <label>Choose Category:</label>
      <select name="my_select" class="form-select mt-3">
        {% for value in category %}
        <option value="{{value}}">{{value}}</option>
        {% endfor %}
      </select>
    </div>
    {% if data %}
    <button type="submit" class="btn btn-primary mb-4">Update</button>
    {% else %}
    <button type="submit" class="btn btn-primary mb-4">Add Expense</button>
    {% endif %}
  </form>
</div>
]{% endblock %}
